name: push
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'test message (leave empty for normal run)'
        required: false
        default: ''
permissions:
  contents: read
concurrency: push
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install web-push@3 --no-save --no-package-lock
      - uses: actions/cache@v4
        with:
          path: .cache
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: node send.js
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TEST: ${{ github.event.inputs.test }}
          SUB_JSON: ${{ secrets.SUB_JSON }}
